name: Release packages

# Push a tag like v1.0.0 (matching the VERSION file) to build the .rpm, .deb
# and Arch packages and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"

      - name: Build packages
        run: packaging/build.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # If the release was already created by hand, replace its files.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
